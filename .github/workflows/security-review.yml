name: Security review

on:
  pull_request:
    branches: [main, feat/optional-mcp-preview, feat/product-controls-and-scenarios, feat/import-performance-layer]
  push:
    branches: [main]
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: project_root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12.10'
      - name: Install isolated security tools
        run: |
          python -m venv .venv-security
          .venv-security/bin/python -m pip install --only-binary=:all: -r security/requirements.txt
          .venv-security/bin/python -m pip check
      - name: Test security gate contracts
        run: .venv-security/bin/python -m unittest discover -s tests -p test_security_checks.py -v
      - name: Review static findings
        if: ${{ !cancelled() }}
        run: .venv-security/bin/python tools/security_review.py static
      - name: Audit complete Windows dependency inventory
        if: ${{ !cancelled() }}
        run: .venv-security/bin/python tools/security_review.py dependencies
      - name: Audit optional MCP inventory when present
        if: ${{ !cancelled() && (hashFiles('project_root/requirements-mcp.txt') != '' || hashFiles('project_root/requirements-mcp.lock') != '' || hashFiles('project_root/requirements-mcp-dev.txt') != '') }}
        run: .venv-security/bin/python tools/security_review.py optional-dependencies --output-dir build/security/optional
      - name: Audit isolated Windows MCP companion inventory
        if: ${{ !cancelled() && (hashFiles('project_root/requirements-mcp-build.txt') != '' || hashFiles('project_root/requirements-mcp-windows.lock') != '') }}
        run: .venv-security/bin/python tools/security_review.py companion-dependencies --output-dir build/security/companion
      - name: Preserve findings and failure status
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            project_root/build/security/**/*.json
            project_root/build/security/**/audit-inventory.txt
          if-no-files-found: error
          retention-days: 14
