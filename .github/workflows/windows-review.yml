name: Windows review build

on:
  pull_request:
    branches: [main, feat/optional-mcp-preview, feat/product-controls-and-scenarios, feat/import-performance-layer]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build-and-smoke:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: project_root
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact reviewed commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Discover installed fonts for Windows offscreen QA
        run: .\tools\configure_windows_qt_fonts.ps1
      - name: Install fixed Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Install hash-locked build environment
        run: |
          python -m venv .venv-build
          .\.venv-build\Scripts\python.exe -m pip install --require-hashes --only-binary=:all: -r requirements-windows.lock
          if ($LASTEXITCODE -ne 0) { throw 'Locked installation failed.' }
          .\.venv-build\Scripts\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Dependency validation failed.' }
          New-Item -ItemType Directory -Force build/reports | Out-Null
          .\.venv-build\Scripts\python.exe -m pip freeze | Out-File -Encoding utf8 build/reports/build-environment.txt
      - name: Collect full regression inventory
        id: regression-inventory
        timeout-minutes: 2
        run: |
          .\.venv-build\Scripts\python.exe -m pytest --collect-only -q -p tools.windows_test_batches --test-inventory=build/reports/tests-all-inventory.json
          if ($LASTEXITCODE -ne 0) { throw 'Full regression collection failed.' }
      - name: Run GUI regression tests
        timeout-minutes: 8
        run: |
          .\.venv-build\Scripts\python.exe -m pytest -vv -p tools.windows_test_batches --regression-batch=gui --test-inventory=build/reports/tests-gui-inventory.json -o faulthandler_timeout=120 --junitxml=build/reports/tests-gui.xml
          if ($LASTEXITCODE -ne 0) { throw 'GUI regression tests failed.' }
      - name: Run GUI layout regression tests
        # Isolate the expensive real-font layout/palette matrices without
        # dropping tests or weakening the eight-minute GUI timeout.
        if: ${{ !cancelled() && steps.regression-inventory.outcome == 'success' }}
        timeout-minutes: 6
        run: |
          .\.venv-build\Scripts\python.exe -m pytest -vv -p tools.windows_test_batches --regression-batch=gui-layout --test-inventory=build/reports/tests-gui-layout-inventory.json -o faulthandler_timeout=120 --junitxml=build/reports/tests-gui-layout.xml
          if ($LASTEXITCODE -ne 0) { throw 'GUI layout regression tests failed.' }
      - name: Run theme runtime regression tests
        # Full-application palette repolishing dominates Windows GUI time.
        # Collect evidence from all batches even if GUI tests fail; a failed
        # step still blocks every subsequent build and packaging step.
        if: ${{ !cancelled() && steps.regression-inventory.outcome == 'success' }}
        timeout-minutes: 7
        run: |
          .\.venv-build\Scripts\python.exe -m pytest -vv -p tools.windows_test_batches --regression-batch=theme-runtime --test-inventory=build/reports/tests-theme-runtime-inventory.json -o faulthandler_timeout=120 --junitxml=build/reports/tests-theme-runtime.xml
          if ($LASTEXITCODE -ne 0) { throw 'Theme runtime regression tests failed.' }
      - name: Run remaining regression tests
        if: ${{ !cancelled() && steps.regression-inventory.outcome == 'success' }}
        timeout-minutes: 4
        run: |
          .\.venv-build\Scripts\python.exe -m pytest -vv -p tools.windows_test_batches --regression-batch=remaining --test-inventory=build/reports/tests-remaining-inventory.json -o faulthandler_timeout=120 --junitxml=build/reports/tests-remaining.xml
          if ($LASTEXITCODE -ne 0) { throw 'Remaining regression tests failed.' }
      - name: Verify exact regression batch coverage
        if: ${{ !cancelled() && steps.regression-inventory.outcome == 'success' }}
        timeout-minutes: 1
        run: |
          .\.venv-build\Scripts\python.exe tools/windows_test_batches.py --verify build/reports
          if ($LASTEXITCODE -ne 0) { throw 'Regression batch coverage verification failed.' }
      - name: Generate current manual
        run: |
          .\.venv-build\Scripts\python.exe tools/build_manual.py --output build/docs/MANUAL_USUARIO.pdf
          if ($LASTEXITCODE -ne 0) { throw 'Manual generation failed.' }
      - name: Build isolated offline MCP companion first
        run: .\build_mcp.ps1
      - name: Build unsigned onedir application
        run: .\build_exe.ps1 -McpPrepared
      - name: Validate bundled installation and real frozen MCP with no Python in child PATH
        timeout-minutes: 5
        run: |
          $runner = (Resolve-Path 'build/mcp/venv/Scripts/python.exe').Path
          & $runner tools/frozen_mcp_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Frozen MCP preparation/protocol verification failed.' }
      - name: Validate packaged application in an isolated session
        run: |
          # Frozen execution with Python locations removed; not a clean-PC claim.
          $oldPath = $env:PATH
          $env:PATH = "$env:SystemRoot/System32;$env:SystemRoot"
          $env:PYTHONHOME = $null
          $env:PYTHONPATH = $null
          $smokeDir = Join-Path $PWD 'build/reports/packaged-smoke'
          $process = Start-Process -FilePath 'dist/SORTH/SORTH.exe' -ArgumentList @('--smoke-test', '--smoke-output', "`"$smokeDir`"") -PassThru
          if (-not $process.WaitForExit(120000)) {
            $process.Kill()
            throw 'Packaged application timed out.'
          }
          if ($process.ExitCode -ne 0) { throw "Packaged app exited with $($process.ExitCode)." }
          $result = Get-Content (Join-Path $smokeDir 'smoke-result.json') -Raw | ConvertFrom-Json
          if (-not $result.ok -or -not $result.frozen -or $result.assigned -ne $result.groups) {
            throw 'Packaged smoke validation failed.'
          }
          foreach ($phase in @('startup', 'es', 'en')) {
            if (-not $result.text_rendering.$phase.ok) { throw "Missing readable text evidence: $phase." }
          }
          $env:PATH = $oldPath
          Write-Host "Packaged app: $($result.assigned)/$($result.groups) sessions assigned."
      - name: Validate no-Python recovery command on synthetic smoke data
        run: |
          $tokens = $null; $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'tools/collect_windows_acceptance.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          $source = Join-Path $PWD 'build/reports/schema1-session.db'
          .\.venv-build\Scripts\python.exe -c "import sqlite3; from pathlib import Path; db=sqlite3.connect('build/reports/schema1-session.db'); db.executescript(Path('tests/fixtures/session-schema1.sql').read_text(encoding='utf-8')); db.close()"
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic schema1 fixture preparation failed.' }
          $candidate = Join-Path $PWD 'build/reports/recovered-session.db'
          $report = Join-Path $PWD 'build/reports/recovery-command.json'
          $sourceHash = (Get-FileHash -LiteralPath $source).Hash
          $oldPath = $env:PATH
          try {
            $env:PATH = "$env:SystemRoot/System32;$env:SystemRoot"
            $env:PYTHONHOME = $null
            $env:PYTHONPATH = $null
            $p = Start-Process -FilePath 'dist/SORTH/SORTH.exe' -ArgumentList @('--recover-session', '--source', "`"$source`"", '--output', "`"$candidate`"", '--report', "`"$report`"") -PassThru
            if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'Recovery command timed out.' }
            if ($p.ExitCode -ne 0) { throw 'Recovery command failed.' }
            $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
            if (-not $result.ok -or $result.activated -or -not (Test-Path -LiteralPath $candidate)) { throw 'Invalid recovery evidence.' }
            if ((Get-FileHash -LiteralPath $source).Hash -ne $sourceHash) { throw 'Recovery changed original data.' }
          } finally { $env:PATH = $oldPath }
      - name: Prepare unsigned review ZIP and checksums
        run: |
          .\.venv-build\Scripts\python.exe tools/package_windows.py --commit $env:SOURCE_COMMIT
          if ($LASTEXITCODE -ne 0) { throw 'Review packaging failed.' }
      - name: Build hash-pinned unsigned per-user installer
        run: .\tools\build_installer.ps1
      - name: Test installed workflow and data-preserving uninstall
        run: .\tools\test_installer.ps1
      - name: Upload review package and current manual
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SORTH-windows-review-${{ github.run_id }}
          path: |
            project_root/build/artifacts/
            project_root/build/docs/MANUAL_USUARIO.pdf
          if-no-files-found: error
          retention-days: 7
      - name: Upload test and smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SORTH-windows-checks-${{ github.run_id }}
          path: |
            project_root/build/reports/*.json
            project_root/build/reports/*.log
            project_root/build/reports/installed-smoke/
            project_root/build/reports/*.txt
            project_root/build/reports/*.xml
            project_root/build/reports/packaged-smoke/*.log
            project_root/build/reports/packaged-smoke/*.json
            project_root/build/reports/packaged-smoke/*.png
            project_root/build/reports/packaged-smoke/*.xlsx
            project_root/build/reports/packaged-smoke/*.csv
          if-no-files-found: ignore
          retention-days: 7
