name: First release approval

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'release/**', 'release-approval/**']

permissions:
  contents: read

concurrency:
  group: first-release-v2.0.0
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.approval.outputs.publish }}
    steps:
      - name: Check out exact proposed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install fixed Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12.10'
      - name: Test fail-closed publisher without network writes
        run: python -m unittest discover -s project_root/tests -p test_release_pipeline.py -v
      - name: Validate release approval
        id: approval
        env:
          EVENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python project_root/tools/release_pipeline.py validate
          python project_root/tools/release_pipeline.py check --event-sha "$EVENT_SHA" >> "$GITHUB_OUTPUT"
